name: Hourly FFD Other Gauges Fetch

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cloudscraper requests playwright
          python -m playwright install chromium --with-deps

      - name: Fetch FFD Other Gauges
        run: python fetch_other_gauges.py

      - name: Commit updated gauges data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_all_gauges.json data/other_gauges.sqlite
          if git diff --cached --quiet; then
            echo "No FFD Other Gauges changes to commit."
          else
            git commit -m "Hourly update: FFD other gauges data"
            git push
          fi
