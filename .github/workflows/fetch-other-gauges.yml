name: Hourly FFD Other Gauges Fetch

on:
  # DISABLED: Moved to VM cron job to prevent divergent branches.
  # Hourly commits from GitHub Actions conflict with WhatsApp bot commits
  # on binary .sqlite files, causing irreconcilable merge conflicts.
  # schedule:
  #   - cron: "0 * * * *"
  workflow_dispatch:  # Keep manual trigger for emergencies

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install dependencies
        run: |
          python -m pip install cloudscraper requests playwright
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install chromium --with-deps
          else
            python -m playwright install-deps chromium
          fi

      - name: Fetch FFD Other Gauges
        run: python FFD_other_gauge_fetch/fetch_other_gauges.py

      - name: Commit updated gauges data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FFD_other_gauge_fetch/latest_all_gauges.json data/other_gauges.sqlite
          if git diff --cached --quiet; then
            echo "No FFD Other Gauges changes to commit."
          else
            git commit -m "Hourly update: FFD other gauges data"
            git push
          fi
