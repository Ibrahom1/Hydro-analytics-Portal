version: "3.8"

# ──────────────────────────────────────────────────────────────────
# Hydro Analytics 2026 — Podman Pod Deployment
# Target: Ubuntu VM 172.18.7.35
# ──────────────────────────────────────────────────────────────────

services:

  # ── Container 1: Reverse Proxy Gateway (Flask) ──────────────────
  hydro-proxy:
    image: localhost/hydro-python:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    container_name: hydro-proxy
    command: ["python", "proxy.py"]
    network_mode: "host"
    volumes:
      - /opt/hydroanalytics/app/proxy.py:/app/proxy.py:ro
      - /opt/hydroanalytics/data:/app/data
      - /opt/hydroanalytics/res_storages:/app/res_storages
      - /opt/hydroanalytics/res_kp:/app/res_kp
      - /opt/hydroanalytics/res_gb:/app/res_gb
      - /opt/hydroanalytics/app/script:/app/script
      - /opt/hydroanalytics/env:/app/env
      - /opt/hydroanalytics/ffd_fetch/latest_all_gauges.json:/app/FFD_other_gauge_fetch/latest_all_gauges.json
    environment:
      - PROXY_PORT=${HYDRO_PROXY_PORT:-8000}
      - UI_PORT=${HYDRO_UI_PORT:-5504}
      - DASHBOARD_PORT=${HYDRO_DASHBOARD_PORT:-5000}
      - GIS_PORT=${HYDRO_GIS_PORT:-8001}
      - METEOBLUE_TOKEN=AsVUCDPHblGrJ76y
      - TZ=Asia/Karachi
    restart: unless-stopped

  # ── Container 2: Dashboard Backend (Flask) ──────────────────────
  hydro-dashboard:
    image: localhost/hydro-python:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    container_name: hydro-dashboard
    command: ["python", "backend/app.py"]
    network_mode: "host"
    volumes:
      - /opt/hydroanalytics/app/backend:/app/backend:ro
      - /opt/hydroanalytics/data:/app/data
      - /opt/hydroanalytics/res_storages:/app/res_storages
      - /opt/hydroanalytics/app/script:/app/script
    environment:
      - PORT=${HYDRO_DASHBOARD_PORT:-5000}
      - TZ=Asia/Karachi
    restart: unless-stopped

  # ── Container 3: GIS Uploader Backend (FastAPI) ─────────────────
  #    Stores layers.json, existing_styles.json & uploads/ in gis_data/
  hydro-gis:
    image: localhost/hydro-python:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    container_name: hydro-gis
    command: >-
      python -m uvicorn gis_uploader_backend.app:app
      --host 0.0.0.0 --port ${HYDRO_GIS_PORT:-8001}
    network_mode: "host"
    volumes:
      - /opt/hydroanalytics/app/gis_uploader_backend:/app/gis_uploader_backend:ro
      - /opt/hydroanalytics/data:/app/data
      - /opt/hydroanalytics/gis_data:/app/gis_uploader_backend/data
    environment:
      - GIS_GEOSERVER_URL=http://172.18.1.87:8080/geoserver
      - GIS_GEOSERVER_WORKSPACE=HydroAnalytics2026
      - GIS_GEOSERVER_USER=admin
      - GIS_GEOSERVER_PASSWORD=geoserver
      - TZ=Asia/Karachi
    restart: unless-stopped

  # ── Container 4: Frontend Static Server (Nginx) ────────────────
  #    Mounts live media/, style/, index.html & script/ from host
  hydro-frontend:
    image: localhost/hydro-frontend:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: hydro-frontend
    network_mode: "host"
    volumes:
      - /opt/hydroanalytics/app/index.html:/usr/share/nginx/html/index.html:ro
      - /opt/hydroanalytics/app/media:/usr/share/nginx/html/media:ro
      - /opt/hydroanalytics/app/style:/usr/share/nginx/html/style:ro
      - /opt/hydroanalytics/app/script:/usr/share/nginx/html/script:ro
      - /opt/hydroanalytics/script/ft_and_percentage.js:/usr/share/nginx/html/script/ft_and_percentage.js:ro
    environment:
      - TZ=Asia/Karachi
    restart: unless-stopped

  # ── Container 5: Cron Fetchers (FFD Gauges + Google Sheets) ────
  hydro-cron:
    image: localhost/hydro-python:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    container_name: hydro-cron
    network_mode: "host"
    shm_size: "512m"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "=========================================="
        echo "  Hydro Analytics Cron Fetchers Starting"
        echo "  $(date '+%Y-%m-%d %H:%M:%S %Z')"
        echo "=========================================="

        # ── Initial run of all scripts on startup ──
        echo "[STARTUP] Running initial fetch..."
        cd /app && python res_storages/fetch_indian_dams_sheet.py 2>&1 && echo "[STARTUP] Google Sheets: OK" || echo "[STARTUP] Google Sheets: FAILED"
        cd /app && python res_storages/storages.py 2>&1 && echo "[STARTUP] Storages: OK" || echo "[STARTUP] Storages: FAILED"
        cd /app && python res_storages/daily_water_situation_db.py 2>&1 && echo "[STARTUP] Daily Water DB: OK" || echo "[STARTUP] Daily Water DB: FAILED"
        cd /app && python FFD_other_gauge_fetch/fetch_other_gauges.py 2>&1 && echo "[STARTUP] FFD Gauges: OK" || echo "[STARTUP] FFD Gauges: FAILED"
        cd /app && python res_gb/gb_stations_db.py 2>&1 && echo "[STARTUP] GB Stations DB: OK" || echo "[STARTUP] GB Stations DB: FAILED"
        echo "[STARTUP] Initial fetch complete."

        # ── Background loop: Google Sheets every 5 minutes ──
        (while true; do
          sleep 300
          echo "[$(date '+%H:%M:%S')] Running: fetch_indian_dams_sheet.py"
          cd /app && python res_storages/fetch_indian_dams_sheet.py 2>&1 || echo "[ERROR] fetch_indian_dams_sheet.py failed"
        done) &

        # ── Background loop: FFD Gauges every 1 hour ──
        (while true; do
          sleep 3600
          echo "[$(date '+%H:%M:%S')] Running: fetch_other_gauges.py"
          cd /app && python FFD_other_gauge_fetch/fetch_other_gauges.py 2>&1 || echo "[ERROR] fetch_other_gauges.py failed"
        done) &

        # ── Background loop: Daily Water DB every 2 hours ──
        (while true; do
          sleep 7200
          echo "[$(date '+%H:%M:%S')] Running: daily_water_situation_db.py"
          cd /app && python res_storages/daily_water_situation_db.py 2>&1 || echo "[ERROR] daily_water_situation_db.py failed"
        done) &

        # ── Background loop: Storages recalc every 2 hours (+5 min offset) ──
        (while true; do
          sleep 7500
          echo "[$(date '+%H:%M:%S')] Running: storages.py"
          cd /app && python res_storages/storages.py 2>&1 || echo "[ERROR] storages.py failed"
        done) &

        # ── Background loop: GB Stations DB every 2 hours (+10 min offset) ──
        (while true; do
          sleep 7800
          echo "[$(date '+%H:%M:%S')] Running: gb_stations_db.py"
          cd /app && python res_gb/gb_stations_db.py 2>&1 || echo "[ERROR] gb_stations_db.py failed"
        done) &

        echo "[SCHEDULER] All background loops started. Waiting forever..."
        # Keep container alive
        wait
    volumes:
      - /opt/hydroanalytics/data:/app/data
      - /opt/hydroanalytics/res_storages:/app/res_storages
      - /opt/hydroanalytics/res_kp:/app/res_kp
      - /opt/hydroanalytics/res_gb:/app/res_gb
      - /opt/hydroanalytics/script:/app/script
      - /opt/hydroanalytics/app/FFD_other_gauge_fetch:/app/FFD_other_gauge_fetch
      - /opt/hydroanalytics/env:/app/env
    environment:
      - TZ=Asia/Karachi
    restart: unless-stopped

  # ── Container 7: Cloudflare Tunnel ─────────────────────────────
  hydro-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hydro-cloudflared
    command: tunnel --no-autoupdate --url http://localhost:${HYDRO_PROXY_PORT:-8000}
    network_mode: "host"
    environment:
      - TZ=Asia/Karachi
    restart: unless-stopped
    depends_on:
      - hydro-proxy
