server {
    listen 5504;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No caching for dynamic JS that gets live-updated
    location = /script/ft_and_percentage.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Cache static assets for 1 day
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|mp4|webm|woff2?|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
